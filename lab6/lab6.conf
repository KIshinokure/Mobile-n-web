# ЛР 6. Виртуальный хост Apache 2.4 с поддержкой SSI (mod_include)
# Установка (Ubuntu / WSL):
#   a2enmod include headers setenvif
#   cp lab6.conf /etc/apache2/sites-available/ && a2ensite lab6 && service apache2 reload

Listen 8086

<VirtualHost *:8086>
    ServerName localhost
    DocumentRoot /var/www/lab6
    DirectoryIndex index.shtml

    <Directory /var/www/lab6>
        # Разрешаем обработку SSI-директив
        Options +Includes -Indexes
        AllowOverride None
        Require all granted

        # Файлы .shtml отдаются как HTML и проходят через фильтр INCLUDES (SSI)
        AddType text/html .shtml
        AddDefaultCharset UTF-8
        AddOutputFilter INCLUDES .shtml

        # Синтаксис выражений как в методичке: expr="$HTTP_COOKIE = /user=old/"
        SSILegacyExprParser on
    </Directory>

    # --- Задание 1 ---------------------------------------------------------
    # Современные браузеры игнорируют <META HTTP-EQUIV="Set-Cookie">,
    # поэтому тот же cookie дублируется настоящим HTTP-заголовком.
    <Files "index.shtml">
        Header always set Set-Cookie "visitor=old; Max-Age=31536000; Path=/"
    </Files>

    # --- Задание 2 ---------------------------------------------------------
    # level.shtml?level=novice|middle|expert -> cookie level=<значение>
    <Files "level.shtml">
        SetEnvIf Query_String "(^|&)level=(novice|middle|expert)(&|$)" LAB6_LEVEL=$2
        Header always set Set-Cookie "level=%{LAB6_LEVEL}e; Max-Age=31536000; Path=/" env=LAB6_LEVEL
    </Files>

    # --- Задание 3 ---------------------------------------------------------
    # reset.shtml отправляет cookie с просроченной датой -> браузер их удаляет
    <Files "reset.shtml">
        Header always add Set-Cookie "visitor=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/"
        Header always add Set-Cookie "level=; Expires=Thu, 01 Jan 1970 00:00:00 GMT; Path=/"
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/lab6_error.log
    CustomLog ${APACHE_LOG_DIR}/lab6_access.log combined
</VirtualHost>
