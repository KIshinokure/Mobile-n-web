<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Размещение рисунков</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Размещение рисунков</h1>
    <a href="Главная.html">← на главную</a>
</header>
<main>
    <p><img src="img/form.svg" alt="Схема формы" width="240" align="left" hspace="16">
       Рисунок выровнен по левому краю, текст обтекает его справа. Атрибут <code>alt</code>
       содержит альтернативный текст, <code>width</code> задаёт ширину, <code>hspace</code> —
       горизонтальный отступ.</p>
    <br clear="all">
    <figure>
        <img src="img/form.svg" alt="Схема формы" width="160">
        <figcaption>Рис. 1. Рисунок с подписью (figure / figcaption)</figcaption>
    </figure>
    <p><a href="Формы.html"><img src="img/form.svg" alt="Перейти к формам" width="80" border="1"></a>
       ← рисунок-ссылка на страницу «Формы».</p>
</main>
</body>
</html>
